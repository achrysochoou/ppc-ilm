services:
  #---------------------------------------------------
  # Shared keymaster
  # ---------------------------------------------------
  keymaster:
    image: zookeeper:latest
    restart: always

  #---------------------------------------------------
  # Shared PostgreSQL
  # ---------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: ilm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  #---------------------------------------------------
  # Shared keycloak
  # ---------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: keycloak
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    command:
      - start-dev

  #---------------------------------------------------
  # Shared syncope
  # ---------------------------------------------------
  syncope:
    image: apache/syncope:4.1.0
    depends_on:
      - db
      - keymaster
    ports:
      - "18080:8080"
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker,postgresql
      DB_URL: jdbc:postgresql://db:5432/syncope?stringtype=unspecified
      DB_USER: syncope
      DB_PASSWORD: syncope
      DB_POOL_MAX: "20"
      DB_POOL_MIN: "5"
      OPENJPA_REMOTE_COMMIT: sjvm
      KEYMASTER_ADDRESS: keymaster:2181
      KEYMASTER_USERNAME: ""
      KEYMASTER_PASSWORD: ""
      SERVICE_DISCOVERY_ADDRESS: http://syncope:8080/syncope/rest/
      ANONYMOUS_USER: anonymous
      ANONYMOUS_KEY: anonymousKey

  syncope-console:
    image: apache/syncope-console:4.1.0
    depends_on:
      - syncope
      - keymaster
    ports:
      - "28080:8080"
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KEYMASTER_ADDRESS: keymaster:2181
      KEYMASTER_USERNAME: ""
      KEYMASTER_PASSWORD: ""
      SERVICE_DISCOVERY_ADDRESS: http://syncope-console:8080/syncope-console/
      ANONYMOUS_USER: anonymous
      ANONYMOUS_KEY: anonymousKey

  syncope-enduser:
    image: apache/syncope-enduser:4.1.0
    depends_on:
      - syncope
      - keymaster
    ports:
      - "38080:8080"
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KEYMASTER_ADDRESS: keymaster:2181
      KEYMASTER_USERNAME: ""
      KEYMASTER_PASSWORD: ""
      SERVICE_DISCOVERY_ADDRESS: http://syncope-enduser:8080/syncope-enduser/
      ANONYMOUS_USER: anonymous
      ANONYMOUS_KEY: anonymousKey

  # ---------------------------------------------------
  # LDAP
  # ---------------------------------------------------
  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap

    restart: unless-stopped

    environment:
      LDAP_ORGANISATION: ILM Platform
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: admin

    ports:
      - "389:389"
      - "636:636"

    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d


  # ---------------------------------------------------
  # phpLDAPadmin
  # ---------------------------------------------------
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: phpldapadmin

    restart: unless-stopped

    depends_on:
      - openldap

    ports:
      - "6443:443"

    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap


  # ---------------------------------------------------
  # Mailpit
  # ---------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit

    restart: unless-stopped

    ports:
      - "1025:1025"
      - "8025:8025"


  # ---------------------------------------------------
  # Adminer
  # ---------------------------------------------------
  adminer:
    image: adminer
    container_name: adminer

    restart: unless-stopped

    ports:
      - "8081:8080"


volumes:
  postgres_data:
  ldap_data:
  ldap_config:
