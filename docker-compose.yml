services:
  ilm:
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ILM_API_TOKEN: ${ILM_API_TOKEN:?Set ILM_API_TOKEN in .env.local}
      ILM_ALLOW_REPLAY: ${ILM_ALLOW_REPLAY:-false}
      ILM_DB: /app/runtime/ilm.sqlite
      ILM_LOG_QUEUE_BYTES: ${ILM_LOG_QUEUE_BYTES:-1048576}
      ILM_LOG_HEALTH: ${ILM_LOG_HEALTH:-false}
    volumes:
      - ilm_data:/app/runtime
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
  #---------------------------------------------------
  # Shared keymaster
  # ---------------------------------------------------
  keymaster:
    image: zookeeper:3.9.3
    volumes:
      - keymaster_data:/data
      - keymaster_datalog:/datalog
    restart: always

  #---------------------------------------------------
  # Shared PostgreSQL
  # ---------------------------------------------------
  db:
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    container_name: ilm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env.local}
      SYNCOPE_DB_PASSWORD: ${SYNCOPE_DB_PASSWORD:?Set SYNCOPE_DB_PASSWORD in .env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"

  #---------------------------------------------------
  # Shared keycloak
  # ---------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: keycloak
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env.local}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env.local}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    command:
      - start-dev

  #---------------------------------------------------
  # Shared syncope
  # ---------------------------------------------------
  syncope:
    image: apache/syncope:4.1.0
    depends_on:
      db:
        condition: service_healthy
      keymaster:
        condition: service_started
    ports:
      - "127.0.0.1:18080:8080"
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker,postgresql
      DB_URL: jdbc:postgresql://db:5432/syncope?stringtype=unspecified
      DB_USER: syncope
      DB_PASSWORD: ${SYNCOPE_DB_PASSWORD:?Set SYNCOPE_DB_PASSWORD in .env.local}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-5}
      OPENJPA_REMOTE_COMMIT: ${OPENJPA_REMOTE_COMMIT:-sjvm}
      KEYMASTER_ADDRESS: keymaster:2181
      KEYMASTER_USERNAME: ""
      KEYMASTER_PASSWORD: ""
      SERVICE_DISCOVERY_ADDRESS: http://syncope:8080/syncope/rest/
      ANONYMOUS_USER: ${ANONYMOUS_USER:-anonymous}
      ANONYMOUS_KEY: ${ANONYMOUS_KEY:?Set ANONYMOUS_KEY in .env.local}

  syncope-console:
    image: apache/syncope-console:4.1.0
    depends_on:
      syncope:
        condition: service_started
      keymaster:
        condition: service_started
    ports:
      - "127.0.0.1:28080:8080"
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KEYMASTER_ADDRESS: keymaster:2181
      KEYMASTER_USERNAME: ""
      KEYMASTER_PASSWORD: ""
      SERVICE_DISCOVERY_ADDRESS: http://syncope-console:8080/syncope-console/
      ANONYMOUS_USER: ${ANONYMOUS_USER:-anonymous}
      ANONYMOUS_KEY: ${ANONYMOUS_KEY:?Set ANONYMOUS_KEY in .env.local}

  syncope-enduser:
    image: apache/syncope-enduser:4.1.0
    depends_on:
      syncope:
        condition: service_started
      keymaster:
        condition: service_started
    ports:
      - "127.0.0.1:38080:8080"
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KEYMASTER_ADDRESS: keymaster:2181
      KEYMASTER_USERNAME: ""
      KEYMASTER_PASSWORD: ""
      SERVICE_DISCOVERY_ADDRESS: http://syncope-enduser:8080/syncope-enduser/
      ANONYMOUS_USER: ${ANONYMOUS_USER:-anonymous}
      ANONYMOUS_KEY: ${ANONYMOUS_KEY:?Set ANONYMOUS_KEY in .env.local}

  # ---------------------------------------------------
  # LDAP
  # ---------------------------------------------------
  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap

    restart: unless-stopped

    environment:
      LDAP_ORGANISATION: ILM Platform
      LDAP_DOMAIN: example.org
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?Set LDAP_ADMIN_PASSWORD in .env.local}

    ports:
      - "127.0.0.1:389:389"
      - "127.0.0.1:636:636"

    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d


  # ---------------------------------------------------
  # phpLDAPadmin
  # ---------------------------------------------------
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: phpldapadmin

    restart: unless-stopped

    depends_on:
      - openldap

    ports:
      - "127.0.0.1:6443:443"

    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap


  # ---------------------------------------------------
  # Mailpit
  # ---------------------------------------------------
  mailpit:
    image: axllent/mailpit:v1.27.8
    container_name: mailpit

    restart: unless-stopped

    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"


  # ---------------------------------------------------
  # Adminer
  # ---------------------------------------------------
  adminer:
    image: adminer:5.3.0
    container_name: adminer

    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:8080"


volumes:
  keymaster_data:
  keymaster_datalog:
  ilm_data:
  postgres_data:
  ldap_data:
  ldap_config:
